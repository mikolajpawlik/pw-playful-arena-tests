name: Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.config.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: chromium
            pytest_args: --browser chromium
          - name: firefox
            pytest_args: --browser firefox
          - name: mobile-chrome
            pytest_args: --browser chromium --device "Pixel 5"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Python dependencies
        run: pip install -e ".[dev]"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}

      - name: Install Playwright browsers
        run: playwright install --with-deps

      - name: Run tests
        shell: bash
        run: pytest -o "addopts=--screenshot=only-on-failure --tracing=retain-on-failure --video=retain-on-failure" ${{ matrix.config.pytest_args }}

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.config.name }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore
