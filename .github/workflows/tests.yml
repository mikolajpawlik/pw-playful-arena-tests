name: Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.config.name }}
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright/python:v1.59.0-noble
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: chromium
            pytest_args: --browser chromium
          - name: firefox
            pytest_args: --browser firefox
          - name: mobile-chrome
            pytest_args: --browser chromium --device "Pixel 5"

    steps:
      - uses: actions/checkout@v4

      - name: Install Python dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -o "addopts=--screenshot=only-on-failure --tracing=retain-on-failure --video=retain-on-failure" ${{ matrix.config.pytest_args }}

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.config.name }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore
